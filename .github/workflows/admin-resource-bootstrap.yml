name: Admin Resource Bootstrap

on:
  push:
    branches:
      - backend/admin-core-20260930
    paths:
      - ".github/workflows/admin-resource-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: admin-resource-bootstrap
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
          extensions: ctype,curl,dom,fileinfo,filter,hash,mbstring,openssl,pcre,pdo,session,tokenizer,xml,sqlite3,pdo_sqlite

      - name: Install locked backend dependencies
        working-directory: platform/backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare disposable SQLite schema
        working-directory: platform/backend
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/database.sqlite
          php artisan migrate:fresh --force --no-interaction

      - name: Generate Filament 5 resources
        working-directory: platform/backend
        run: |
          set -euo pipefail
          php artisan make:filament-resource Category --generate --panel=admin --record-title-attribute=name_fa --no-interaction
          php artisan make:filament-resource Subcategory --generate --panel=admin --record-title-attribute=name_fa --no-interaction
          php artisan make:filament-resource Product --generate --panel=admin --record-title-attribute=name_fa --no-interaction
          php artisan make:filament-resource Customer --generate --panel=admin --record-title-attribute=name --no-interaction
          find app/Filament/Resources -type f -name '*.php' -print | sort

      - name: Verify generated resources parse and are discoverable
        working-directory: platform/backend
        run: |
          set -euo pipefail
          find app/Filament/Resources -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php artisan route:list --path=admin --no-ansi >/tmp/admin-routes.txt
          grep -E 'admin/(categories|subcategories|products|customers)' /tmp/admin-routes.txt

      - name: Commit generated resources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/backend/app/Filament/Resources
          git diff --cached --quiet && {
            echo "No Filament resource files were generated."
            exit 1
          }
          git commit -m "feat: generate Filament 5 admin resources"
          git push origin HEAD:backend/admin-core-20260930
