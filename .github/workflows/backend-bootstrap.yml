name: Backend Bootstrap

on:
  push:
    branches:
      - backend/bootstrap-laravel13-20260930
    paths:
      - ".github/workflows/backend-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: backend-bootstrap-laravel13
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
          extensions: ctype,curl,dom,fileinfo,filter,hash,mbstring,openssl,pcre,pdo,session,tokenizer,xml,sqlite3,pdo_sqlite

      - name: Guard bootstrap destination
        shell: bash
        run: |
          set -euo pipefail
          test ! -e platform/backend || {
            echo "platform/backend already exists; refusing destructive bootstrap."
            exit 1
          }

      - name: Generate Laravel 13
        shell: bash
        run: |
          set -euo pipefail
          composer create-project laravel/laravel:^13.0 /tmp/armaghan-backend --no-interaction --prefer-dist
          cd /tmp/armaghan-backend
          php artisan --version | grep -E 'Laravel Framework 13\.'

      - name: Install Filament 5 panel
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/armaghan-backend
          composer require filament/filament:"^5.0" -W --no-interaction --prefer-dist
          php artisan filament:install --panels --no-interaction
          test -f app/Providers/Filament/AdminPanelProvider.php
          FILAMENT_VERSION="$(composer show filament/filament --format=json | jq -r '.versions[0]')"
          echo "Resolved Filament: $FILAMENT_VERSION"
          [[ "$FILAMENT_VERSION" == *"5."* ]]

      - name: Copy generated backend into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p platform/backend
          rsync -a --exclude='.git' /tmp/armaghan-backend/ platform/backend/

      - name: Add Armaghan environment contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > platform/backend/.env.production.example <<'EOF'
          APP_NAME=Armaghan
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=https://example.invalid

          LOG_CHANNEL=stack
          LOG_LEVEL=warning

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=
          DB_USERNAME=
          DB_PASSWORD=

          SESSION_DRIVER=database
          CACHE_STORE=database
          QUEUE_CONNECTION=database
          EOF

          cat > platform/backend/README-ARMAGHAN.md <<'EOF'
          # Armaghan Backend

          Laravel 13 + Filament 5 backend for Armaghan.

          ## Environment policy

          - Local/dev/test: SQLite by default.
          - Production: MySQL/MariaDB via environment-only credentials.
          - Never commit `.env`, production credentials, or `APP_KEY`.
          - The production host serves only the Laravel public surface; application/private files stay outside `public_html`.
          - Composer dependencies are built in CI for production deployment because host web-PHP shell functions are disabled.

          ## Current bootstrap scope

          This bootstrap installs Laravel and the Filament panel only. Domain migrations/models/resources, admin-user provisioning, media, public API endpoints, magic links, favorites sharing, and semantic theme settings are separate bounded batches.
          EOF

      - name: Verify generated backend
        working-directory: platform/backend
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          php artisan --version | grep -E 'Laravel Framework 13\.'
          composer show filament/filament --no-ansi | grep -E '^versions[[:space:]]*:.*5\.'
          test -f app/Providers/Filament/AdminPanelProvider.php
          php artisan route:list --path=up --no-ansi | grep -E 'GET|HEAD'
          php artisan route:list --path=admin --no-ansi >/tmp/armaghan-admin-routes.txt
          grep -E 'admin' /tmp/armaghan-admin-routes.txt
          php artisan test
          composer audit --locked --no-interaction

      - name: Verify secret and scope safety
        shell: bash
        run: |
          set -euo pipefail
          test ! -f platform/backend/.env || {
            echo "Generated .env exists in workspace as expected for tests but must remain git-ignored."
          }
          git check-ignore -q platform/backend/.env
          git check-ignore -q platform/backend/vendor
          if git status --short --untracked-files=all | grep -E '(^| )t/(26|27)/|(^| )t/index\.htm'; then
            echo "Numbered UI snapshot or launcher was unexpectedly modified."
            exit 1
          fi

      - name: Commit generated backend to bootstrap branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/backend
          if git diff --cached --quiet; then
            echo "No backend files generated."
            exit 1
          fi
          git commit -m "feat: bootstrap Laravel 13 and Filament 5 backend"
          git push origin HEAD:backend/bootstrap-laravel13-20260930
