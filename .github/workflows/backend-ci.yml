name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "platform/backend/**"
      - "platform/scripts/deploy_laravel_shared_hosting.py"
      - "platform/scripts/hosting_preflight.py"
      - "platform/scripts/deploy_laravel_code_update.py"
      - "platform/scripts/deploy_laravel_additive_update.py"
      - "platform/scripts/bootstrap_catalog_ftp.py"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "platform/backend/**"
      - "platform/scripts/deploy_laravel_shared_hosting.py"
      - "platform/scripts/hosting_preflight.py"
      - "platform/scripts/bootstrap_catalog_ftp.py"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
          extensions: ctype,curl,dom,fileinfo,filter,hash,mbstring,openssl,pcre,pdo,session,tokenizer,xml,sqlite3,pdo_sqlite

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate deployment helper syntax
        run: |
          python -m py_compile ../scripts/deploy_laravel_shared_hosting.py ../scripts/deploy_laravel_code_update.py ../scripts/deploy_laravel_additive_update.py ../scripts/bootstrap_catalog_ftp.py ../scripts/hosting_preflight.py ../scripts/provision_first_admin_ftp.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path("../scripts/deploy_laravel_shared_hosting.py")
          spec=importlib.util.spec_from_file_location("armaghan_deploy",path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path("/tmp/armaghan-activate.php").write_text(
              module.activation_php(
                  "0123456789abcdef",
                  "safe-ci-secret",
                  "https://armaghantrading.com",
                  "release.zip",
              ),
              encoding="utf-8",
          )
          PY
          php -l /tmp/armaghan-activate.php
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path("../scripts/provision_first_admin_ftp.py")
          spec=importlib.util.spec_from_file_location("armaghan_first_admin",path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path("/tmp/armaghan-first-admin.php").write_text(
              module.bootstrap_php(
                  "safe-ci-secret",
                  "admin@example.invalid",
                  "CI Administrator",
                  "U0FGRS1QVUJMSUMtS0VZ",
              ),
              encoding="utf-8",
          )
          PY
          php -l /tmp/armaghan-first-admin.php
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path("../scripts/deploy_laravel_code_update.py")
          spec=importlib.util.spec_from_file_location("armaghan_code_update",path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path("/tmp/armaghan-code-update.php").write_text(
              module.helper_php("0123456789abcdef","safe-ci-secret","release.zip"),
              encoding="utf-8",
          )
          PY
          php -l /tmp/armaghan-code-update.php
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path("../scripts/deploy_laravel_additive_update.py")
          spec=importlib.util.spec_from_file_location("armaghan_additive_update",path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path("/tmp/armaghan-additive-update.php").write_text(
              module.helper_php("0123456789abcdef","safe-ci-secret","release.zip"),
              encoding="utf-8",
          )
          PY
          php -l /tmp/armaghan-additive-update.php
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path("../scripts/bootstrap_catalog_ftp.py")
          spec=importlib.util.spec_from_file_location("armaghan_catalog_bootstrap",path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path("/tmp/armaghan-catalog-bootstrap.php").write_text(
              module.helper_php("safe-ci-secret"),
              encoding="utf-8",
          )
          PY
          php -l /tmp/armaghan-catalog-bootstrap.php

      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/database.sqlite
          php artisan migrate:fresh --force --no-interaction

      - name: Validate dependency definition
        run: composer validate --strict

      - name: Verify framework and admin majors
        run: |
          php artisan --version | grep -E 'Laravel Framework 13\.'
          composer show filament/filament --no-ansi | grep -E '^versions[[:space:]]*:.*5\.'
          test -f app/Providers/Filament/AdminPanelProvider.php
          php artisan route:list --path=up --no-ansi | grep -E 'GET|HEAD'

      - name: Run backend tests
        run: php artisan test

      - name: Audit locked PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Enforce repository secret hygiene
        run: |
          git check-ignore -q .env
          git check-ignore -q vendor
          test ! -e .env.production
