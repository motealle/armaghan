name: Backend Code Deploy

on:
  push:
    branches: [main]
    paths:
      - "platform/backend/**"
      - "platform/scripts/deploy_laravel_code_update.py"
      - ".github/workflows/backend-code-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-code-deploy-production
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      code_only: ${{ steps.plan.outputs.code_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: plan
        name: Guard code-only lane from dependency or migration drift
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code_only=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD --             platform/backend/composer.json             platform/backend/composer.lock             platform/backend/database/migrations; then
            echo "code_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_only=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: plan
    if: needs.plan.outputs.code_only == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
          extensions: ctype,curl,dom,fileinfo,filter,hash,mbstring,openssl,pcre,pdo,session,tokenizer,xml,sqlite3,pdo_sqlite,zip,gd,exif

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/database.sqlite
          php artisan migrate:fresh --force --no-interaction

      - name: Validate and test release
        run: |
          composer validate --strict
          php -l app/Filament/Pages/Auth/Login.php
          php -l app/Http/Controllers/Admin/ProductController.php
          php artisan test tests/Feature/CustomAdminProductsTest.php tests/Feature/PublicCatalogApiTest.php tests/Feature/PasswordAuthTest.php tests/Feature/AdminPanelAccessTest.php tests/Feature/HomeMediaTest.php
          composer audit --locked --no-interaction

      - name: Build production vendor tree
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress

      - name: Build code-only release ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root=Path(".")
          out=Path("/tmp/armaghan-backend-code.zip")
          excluded_prefixes=("tests/","node_modules/","storage/logs/","storage/framework/")
          excluded_exact={".env","database/database.sqlite",".phpunit.cache"}
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  rel=path.as_posix()
                  if rel in excluded_exact or any(rel.startswith(prefix) for prefix in excluded_prefixes):
                      continue
                  z.write(path,rel)
          required={"vendor/autoload.php","bootstrap/app.php","artisan","public/index.php","composer.lock"}
          with zipfile.ZipFile(out) as z:
              names=set(z.namelist())
          missing=required-names
          if missing:
              raise SystemExit("Release ZIP missing: "+", ".join(sorted(missing)))
          print(f"release_bytes={out.stat().st_size}")
          PY

      - name: Validate updater syntax
        run: |
          python -m py_compile ../scripts/deploy_laravel_code_update.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path("../scripts/deploy_laravel_code_update.py")
          spec=importlib.util.spec_from_file_location("armaghan_code_update",path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path("/tmp/armaghan-code-update.php").write_text(
              module.helper_php("0123456789abcdef","safe-ci-secret","release.zip"),
              encoding="utf-8",
          )
          PY
          php -l /tmp/armaghan-code-update.php

      - name: Deploy code-only backend release
        working-directory: .
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ARMAGHAN_SITE_URL: https://armaghantrading.com
        run: python platform/scripts/deploy_laravel_code_update.py --release /tmp/armaghan-backend-code.zip
