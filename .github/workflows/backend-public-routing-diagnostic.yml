name: Backend Public Routing Diagnostic

on:
  push:
    branches:
      - backend/production-sqlite-activation-20261001
    paths:
      - ".github/workflows/backend-public-routing-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public backend files by FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from ftplib import FTP
          from urllib.parse import urlparse
          raw=os.environ["FTP_SERVER"].strip()
          parsed=urlparse(raw) if "://" in raw else None
          host=parsed.hostname if parsed else raw
          port=(parsed.port or 21) if parsed else 21
          ftp=FTP(); ftp.connect(host,port,timeout=20); ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])
          ftp.cwd("/public_html/backend")
          names=set(ftp.nlst())
          try:
              facts={name:meta for name,meta in ftp.mlsd()}
              backend_facts=facts
          except Exception:
              backend_facts={}
          with open("/tmp/static-probe.txt","wb") as fh:
              fh.write(b"armaghan-backend-static-probe")
          with open("/tmp/static-probe.txt","rb") as fh:
              ftp.storbinary("STOR armaghan-backend-static-probe.txt",fh)
          print("backend_dir_exists: true")
          print("index_exists:", "index.php" in names)
          try:
              ht_size=ftp.size(".htaccess")
              ht_exists=ht_size is not None
          except Exception:
              ht_exists=False
          print("htaccess_exists:", ht_exists)
          print("public_entry_count:", len(names))
          print("index_size_known:", bool(backend_facts.get("index.php",{}).get("size")))
          ftp.cwd("/public_html")
          root_htaccess=False
          try:
              chunks=[]
              ftp.retrbinary("RETR .htaccess", chunks.append)
              root_htaccess=True
              text=b"".join(chunks).decode("utf-8","replace")
              safe_lines=[line.strip() for line in text.splitlines() if "Rewrite" in line or "DirectoryIndex" in line or "backend" in line.lower()]
              print("root_htaccess_exists:", True)
              print("root_htaccess_rewrite_lines:", safe_lines[:20])
          except Exception:
              print("root_htaccess_exists:", False)
          ftp.quit()
          if "index.php" not in names: raise SystemExit(2)
          PY

      - name: Check public route statuses
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          urls=[
            "https://armaghantrading.com/backend/armaghan-backend-static-probe.txt",
            "https://armaghantrading.com/backend/index.php",
            "https://armaghantrading.com/backend/",
            "https://armaghantrading.com/backend/up",
            "https://armaghantrading.com/backend/api/style-profile/staging",
            "https://armaghantrading.com/backend/admin/login",
          ]
          for url in urls:
            try:
              req=Request(url,headers={"User-Agent":"Armaghan-Backend-Diagnostic/1.0","Accept":"application/json,text/html;q=0.9,*/*;q=0.8"})
              with urlopen(req,timeout=20) as r:
                body=r.read(4096)
                print(url.split("armaghantrading.com",1)[1], r.status, r.headers.get_content_type(), len(body))
            except HTTPError as e:
              print(url.split("armaghantrading.com",1)[1], e.code, e.headers.get_content_type() if e.headers else "unknown", 0)
            except URLError:
              print(url.split("armaghantrading.com",1)[1], "connection-error")
          PY


      - name: Clean temporary static probe
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from ftplib import FTP
          from urllib.parse import urlparse
          raw=os.environ["FTP_SERVER"].strip()
          parsed=urlparse(raw) if "://" in raw else None
          host=parsed.hostname if parsed else raw
          port=(parsed.port or 21) if parsed else 21
          ftp=FTP(); ftp.connect(host,port,timeout=20); ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])
          try:
              ftp.cwd("/public_html/backend")
              ftp.delete("armaghan-backend-static-probe.txt")
          except Exception:
              pass
          try: ftp.quit()
          except Exception: ftp.close()
          print("temporary_static_probe_cleanup: PASS")
          PY
