name: Catalog Bootstrap Production

on:
  push:
    branches: [main]
    paths:
      - "platform/scripts/bootstrap_catalog_ftp.py"
      - ".github/workflows/catalog-bootstrap-production.yml"

permissions:
  contents: read

concurrency:
  group: catalog-bootstrap-production
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate bootstrap helper
        run: |
          python -m py_compile platform/scripts/bootstrap_catalog_ftp.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path("platform/scripts/bootstrap_catalog_ftp.py")
          spec=importlib.util.spec_from_file_location("catalog_bootstrap",path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          Path("/tmp/armaghan-catalog-bootstrap.php").write_text(
              module.helper_php("safe-ci-secret"),
              encoding="utf-8",
          )
          PY
          php -l /tmp/armaghan-catalog-bootstrap.php

      - name: Bootstrap production catalog once
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ARMAGHAN_SITE_URL: https://armaghantrading.com
        run: python platform/scripts/bootstrap_catalog_ftp.py
