name: Frontend PR focused check

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform/frontend/**'
      - '.github/workflows/frontend-pr-smoke.yml'

permissions:
  contents: read

jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run type-check
      - name: Targeted media and customer safety regression
        run: npx vitest run src/features/admin/services/productQuickOrder.spec.ts src/features/catalog/components/ProductCard.spec.ts src/features/admin/services/productOrder.spec.ts src/features/catalog/services/productFilters.spec.ts src/features/catalog/services/catalogApi.spec.ts src/features/catalog/components/ProductDetailSheet.spec.ts src/features/help/guide.spec.ts src/features/admin/services/productImagePreparation.spec.ts src/features/admin/services/productImageSubmission.spec.ts src/features/admin/components/BackendProductEditor.spec.ts src/features/home-media/targets.spec.ts
      - name: Verify production Vite bundling without deployment
        run: npx vite build
