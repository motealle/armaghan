name: FTP Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - root
          - t
          - both

permissions:
  contents: read

concurrency:
  group: ftp-deploy-main
  cancel-in-progress: false

env:
  FTP_TARGET_ROOT: /public_html
  FTP_TARGET_T: /public_html/t

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.plan.outputs.root }}
      t: ${{ steps.plan.outputs.t }}
      frontend: ${{ steps.plan.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine deployment scope
        id: plan
        shell: bash
        run: |
          root=false
          t=false
          frontend=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.target }}" in
              root) root=true ;;
              t) t=true; frontend=true ;;
              both) root=true; t=true; frontend=true ;;
              auto)
                if git rev-parse HEAD^ >/dev/null 2>&1; then
                  files="$(git diff --name-only HEAD^ HEAD)"
                  grep -qx 'index.html' <<< "$files" && root=true || true
                  grep -qx 'logo.png' <<< "$files" && root=true || true
                  grep -q '^t/' <<< "$files" && t=true || true
                  if grep -q '^platform/frontend/' <<< "$files"; then
                    frontend=true
                    t=true
                  fi
                else
                  root=true
                fi
                ;;
            esac
          else
            files="$(git diff --name-only HEAD^ HEAD)"
            grep -qx 'index.html' <<< "$files" && root=true || true
            grep -qx 'logo.png' <<< "$files" && root=true || true
            grep -q '^t/' <<< "$files" && t=true || true
            if grep -q '^platform/frontend/' <<< "$files"; then
              frontend=true
              t=true
            fi
          fi

          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "t=$t" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Deploy root: $root"
          echo "Deploy /t: $t"
          echo "Build Test 12 frontend: $frontend"

  qa:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Protect immutable test snapshots
        run: python tests/test_immutable_snapshots.py

      - name: Test SQLite schema
        run: python tests/test_sqlite_schema.py

      - name: Test Test 11 static contract
        run: python tests/test_test11_contract.py

      - name: Test Test 12 source contract
        run: python tests/test_test12_source_contract.py

      - name: Check Test 11 JavaScript syntax
        run: node --check t/11/assets/app.js

      - name: Check Python syntax
        run: python -m compileall -q tests platform/scripts

      - name: Setup Node for Vue build
        if: needs.plan.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Install Vue dependencies
        if: needs.plan.outputs.frontend == 'true'
        working-directory: platform/frontend
        run: npm install --no-audit --no-fund

      - name: Type-check, unit test and build Test 12
        if: needs.plan.outputs.frontend == 'true'
        working-directory: platform/frontend
        run: npm run build

      - name: Upload Test 12 build artifact
        if: needs.plan.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test12-build
          path: t/12
          if-no-files-found: error
          retention-days: 1

  smoke-test:
    needs: [plan, qa]
    runs-on: ubuntu-latest
    steps:
      - name: Verify FTP connection and target scope
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from ftplib import FTP
          from urllib.parse import urlparse

          raw = os.environ["FTP_SERVER"].strip()
          if "://" in raw:
              parsed = urlparse(raw)
              host = parsed.hostname
              port = parsed.port or 21
          else:
              host = raw
              port = 21

          if not host:
              raise SystemExit("FTP_SERVER is empty or invalid")

          ftp = FTP()
          ftp.connect(host, port, timeout=20)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          print("FTP authentication: OK")
          print("FTP starting directory:", ftp.pwd())
          ftp.cwd("public_html")
          print("/public_html: FOUND")
          print("Target directory:", ftp.pwd())
          ftp.cwd("..")
          if ftp.pwd() != "/":
              raise SystemExit("Safety check failed: FTP root is not '/'")
          ftp.quit()
          print("FTP scope check: PASS")
          PY

  deploy-root:
    needs: [plan, qa, smoke-test]
    if: needs.plan.outputs.root == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy only root landing files to /public_html
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from ftplib import FTP
          from urllib.parse import urlparse

          raw = os.environ["FTP_SERVER"].strip()
          if "://" in raw:
              parsed = urlparse(raw)
              host = parsed.hostname
              port = parsed.port or 21
          else:
              host = raw
              port = 21

          ftp = FTP()
          ftp.connect(host, port, timeout=20)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.cwd("public_html")

          for filename in ("index.html", "logo.png"):
              if not os.path.isfile(filename):
                  raise SystemExit(f"Required deployment file missing: {filename}")
              with open(filename, "rb") as fh:
                  ftp.storbinary(f"STOR {filename}", fh)
              print(f"Uploaded /public_html/{filename}")

          ftp.quit()
          print("Root deployment complete. No remote files were deleted.")
          PY

  deploy-t:
    needs: [plan, qa, smoke-test]
    if: needs.plan.outputs.t == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download Test 12 build
        if: needs.plan.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: test12-build
          path: t/12

      - name: Deploy changed /t files and generated Test 12 only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FRONTEND_CHANGED: ${{ needs.plan.outputs.frontend }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from ftplib import FTP
          from urllib.parse import urlparse

          raw = os.environ["FTP_SERVER"].strip()
          if "://" in raw:
              parsed = urlparse(raw)
              host = parsed.hostname
              port = parsed.port or 21
          else:
              host = raw
              port = 21

          if not os.path.isdir("t"):
              raise SystemExit("t/ directory is required for /public_html/t deployment")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD^", "HEAD", "--", "t/"],
              text=True,
          ).splitlines()
          changed = [p for p in changed if p.startswith("t/") and os.path.isfile(p)]

          if os.environ.get("FRONTEND_CHANGED") == "true":
              if not os.path.isdir("t/12"):
                  raise SystemExit("Generated Test 12 build is missing")
              for root, _, files in os.walk("t/12"):
                  for filename in files:
                      changed.append(os.path.join(root, filename))

          changed = sorted(set(changed))

          ftp = FTP()
          ftp.connect(host, port, timeout=20)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.cwd("/public_html")

          try:
              ftp.cwd("t")
          except Exception:
              ftp.mkd("t")
              ftp.cwd("t")

          base_remote = "/public_html/t"

          for local_path in changed:
              rel_path = os.path.relpath(local_path, "t").replace(os.sep, "/")
              parts = rel_path.split("/")
              filename = parts[-1]
              dir_parts = parts[:-1]

              ftp.cwd(base_remote)
              remote_dir = base_remote
              for part in dir_parts:
                  try:
                      ftp.cwd(part)
                  except Exception:
                      ftp.mkd(part)
                      ftp.cwd(part)
                  remote_dir += "/" + part

              with open(local_path, "rb") as fh:
                  ftp.storbinary(f"STOR {filename}", fh)
              print("Uploaded " + remote_dir + "/" + filename)

          ftp.quit()
          print(f"/t incremental deployment complete: {len(changed)} file(s).")
          print("Frozen test folders were not re-uploaded. No remote files were deleted.")
          PY
