name: FTP Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "auto"
        type: choice
        options: [auto, root, t, both]
      root_version:
        description: "Existing numbered version to promote at domain root (blank uses config/root-release.json)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ftp-deploy-main
  cancel-in-progress: false

env:
  FTP_TARGET_ROOT: /public_html
  FTP_TARGET_T: /public_html/t
  ACTIVE_UI_TEST: '29'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.plan.outputs.root }}
      t: ${{ steps.plan.outputs.t }}
      frontend: ${{ steps.plan.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Determine deployment scope
        id: plan
        shell: bash
        run: |
          root=false; t=false; frontend=false
          is_frontend_release_change() {
            local list="$1"
            grep '^platform/frontend/' <<< "$list" | grep -Ev '^platform/frontend/(vite\.config\.ts|README\.md)$' | grep -q .
          }
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.target }}" in
              root) root=true ;;
              t) t=true; frontend=true ;;
              both) root=true; t=true; frontend=true ;;
              auto)
                files="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
                grep -qx 'index.html' <<< "$files" && root=true || true
                grep -qx 'logo.png' <<< "$files" && root=true || true
                grep -Eq '^(config/root-release\.json|platform/scripts/promote_root_release\.py)
                grep -q '^t/' <<< "$files" && t=true || true
                if is_frontend_release_change "$files"; then frontend=true; t=true; fi
                ;;
            esac
          else
            before="${{ github.event.before }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              files="$(git diff --name-only "$before" "$GITHUB_SHA")"
            else
              files="$(git diff --name-only HEAD^ HEAD)"
            fi
            grep -qx 'index.html' <<< "$files" && root=true || true
            grep -qx 'logo.png' <<< "$files" && root=true || true
            grep -q '^t/' <<< "$files" && t=true || true
            if is_frontend_release_change "$files"; then frontend=true; t=true; fi
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "t=$t" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  qa:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Protect immutable test snapshots
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python tests/test_immutable_snapshots.py
      - name: Test SQLite schema
        run: python tests/test_sqlite_schema.py
      - name: Test Test 11 static contract
        run: python tests/test_test11_contract.py
      - name: Test Test 12 regression contract
        run: python tests/test_test12_source_contract.py
      - name: Test Test 13 regression contract
        run: python tests/test_test13_source_contract.py
      - name: Test Test 14 accessibility contract
        run: python tests/test_test14_accessibility_contract.py
      - name: Test Test 15 sheet accessibility contract
        run: python tests/test_test15_sheet_accessibility_contract.py
      - name: Test Test 15 media/language contract
        run: python tests/test_test15_media_language_contract.py
      - name: Test Test 16 adaptive commerce contract
        run: python tests/test_test16_adaptive_commerce_contract.py
      - name: Test Test 17 mobile drawer/modal contract
        run: python tests/test_test17_mobile_drawer_modal_contract.py
      - name: Test Test 18 app navigation/drawer dashboard contract
        run: python tests/test_test18_appnav_drawer_dashboard_contract.py
      - name: Test Test 19 production/admin/i18n contract
        run: python tests/test_test19_production_admin_i18n_contract.py
      - name: Test Test 20 customer/product admin contract
        run: python tests/test_test20_customer_product_admin_contract.py
      - name: Test web-stock provenance policy
        run: python tests/test_web_stock_policy.py
      - name: Test generated-media contract
        run: python tests/test_generated_media_contract.py
      - name: Test product-placeholder media contract
        run: python tests/test_product_placeholder_contract.py
      - name: Test Test 21 placeholder/admin contract
        run: python tests/test_test21_placeholder_admin_contract.py
      - name: Test Test 22 release contract
        run: python tests/test_test22_release_contract.py
      - name: Test Test 23 product-card/category contract
        run: python tests/test_test23_product_cards_contract.py
      - name: Test Test 24 responsive commerce/admin contract
        run: python tests/test_test24_responsive_commerce_contract.py
      - name: Test Test 25 reversible media contract
        run: python tests/test_test25_reversible_media_contract.py
      - name: Test Test 25 screenshot hotfix contract
        run: python tests/test_test25_bugfix2_contract.py
      - name: Test frozen Test 26 handoff contract
        run: python tests/test_test26_appearance_contract.py
      - name: Test frozen Test 27 boundary contract
        run: python tests/test_test27_frozen_lane_contract.py
      - name: Test frozen Test 28 / active Test 29 promotion contract
        run: python tests/test_test28_frozen_lane_contract.py
      - name: Test Test 29 visual editor foundation contract
        run: python tests/test_test29_visual_editor_contract.py
      - name: Test Test 29 customer auth/session contract
        run: python tests/test_test29_customer_auth_contract.py
      - name: Test Test 29 persisted FavoriteShare contract
        run: python tests/test_test29_favorite_share_contract.py
      - name: Test encrypted off-host SQLite backup contract
        run: python tests/test_sqlite_offhost_backup_contract.py
      - name: Test independent root release selection
        run: python tests/test_root_release.py
      - name: Check Test 11 JavaScript syntax
        run: node --check t/11/assets/app.js
      - name: Check Python syntax
        run: python -m compileall -q tests platform/scripts
      - name: Setup Node for Vue build
        if: needs.plan.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with: { node-version: '24.15.0' }
      - name: Install portrait media build dependency
        if: needs.plan.outputs.frontend == 'true'
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Install Vue dependencies
        if: needs.plan.outputs.frontend == 'true'
        working-directory: platform/frontend
        run: npm ci --no-audit --no-fund
      - name: Generate portrait media, type-check, unit test and build active UI test
        if: needs.plan.outputs.frontend == 'true'
        env:
          ARMAGHAN_UI_TARGET: ${{ env.ACTIVE_UI_TEST }}
        working-directory: platform/frontend
        run: npm run build
      - name: Upload active UI build artifact
        if: needs.plan.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-${{ env.ACTIVE_UI_TEST }}-build
          path: t/${{ env.ACTIVE_UI_TEST }}
          if-no-files-found: error
          retention-days: 1

  smoke-test:
    needs: [plan, qa]
    runs-on: ubuntu-latest
    steps:
      - name: Verify FTP connection and target scope
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from ftplib import FTP
          from urllib.parse import urlparse
          raw=os.environ["FTP_SERVER"].strip(); parsed=urlparse(raw) if "://" in raw else None
          host=parsed.hostname if parsed else raw; port=(parsed.port or 21) if parsed else 21
          if not host: raise SystemExit("FTP_SERVER is empty or invalid")
          ftp=FTP(); ftp.connect(host,port,timeout=20); ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])
          ftp.cwd("public_html"); print("/public_html: FOUND"); ftp.cwd("..")
          if ftp.pwd() != "/": raise SystemExit("Safety check failed: FTP root is not '/'")
          ftp.quit(); print("FTP scope check: PASS")
          PY

  deploy-root:
    needs: [plan, qa, smoke-test, deploy-t]
    if: >-
      always() && needs.plan.outputs.root == 'true' &&
      needs.qa.result == 'success' && needs.smoke-test.result == 'success' &&
      (needs.deploy-t.result == 'success' || needs.deploy-t.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote selected existing numbered version to domain root
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ROOT_RELEASE_VERSION: ${{ inputs.root_version }}
        run: python platform/scripts/promote_root_release.py

  deploy-t:
    needs: [plan, qa, smoke-test]
    if: needs.plan.outputs.t == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Download active UI build
        if: needs.plan.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ui-test-${{ env.ACTIVE_UI_TEST }}-build
          path: t/${{ env.ACTIVE_UI_TEST }}
      - name: Deploy changed /t files and active generated UI test only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FRONTEND_CHANGED: ${{ needs.plan.outputs.frontend }}
          ACTIVE_UI_TEST: ${{ env.ACTIVE_UI_TEST }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os, subprocess
          from ftplib import FTP
          from urllib.parse import urlparse
          raw=os.environ["FTP_SERVER"].strip(); parsed=urlparse(raw) if "://" in raw else None
          host=parsed.hostname if parsed else raw; port=(parsed.port or 21) if parsed else 21
          if not os.path.isdir("t"): raise SystemExit("t/ directory is required")
          before=os.environ.get("BEFORE_SHA","").strip()
          if before and before!="0000000000000000000000000000000000000000":
              diff_range=[before,"HEAD"]
          else:
              diff_range=["HEAD^","HEAD"]
          changed=subprocess.check_output(["git","diff","--name-only",*diff_range,"--","t/"],text=True).splitlines()
          changed=[p for p in changed if p.startswith("t/") and os.path.isfile(p)]

          # Sync the launcher exactly as committed; staged UI output may remain intentionally unlinked.
          if os.path.isfile("t/index.htm"):
              changed.append("t/index.htm")

          if os.environ.get("FRONTEND_CHANGED")=="true":
              target=os.environ.get("ACTIVE_UI_TEST","").strip()
              if not (len(target)==2 and target.isdigit() and int(target)>28):
                  raise SystemExit("ACTIVE_UI_TEST must be an unfrozen two-digit test number greater than 28")
              target_dir=f"t/{target}"
              if not os.path.isdir(target_dir): raise SystemExit(f"Generated Test {target} build is missing")
              for root,_,files in os.walk(target_dir):
                  for filename in files: changed.append(os.path.join(root,filename))
          changed=sorted(set(changed))
          ftp=FTP(); ftp.connect(host,port,timeout=20); ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"]); ftp.cwd("/public_html")
          try: ftp.cwd("t")
          except Exception: ftp.mkd("t"); ftp.cwd("t")
          base_remote="/public_html/t"
          for local_path in changed:
              rel_path=os.path.relpath(local_path,"t").replace(os.sep,"/"); parts=rel_path.split("/"); filename=parts[-1]
              ftp.cwd(base_remote); remote_dir=base_remote
              for part in parts[:-1]:
                  try: ftp.cwd(part)
                  except Exception: ftp.mkd(part); ftp.cwd(part)
                  remote_dir += "/"+part
              with open(local_path,"rb") as fh: ftp.storbinary(f"STOR {filename}",fh)
              print("Uploaded "+remote_dir+"/"+filename)
          ftp.quit(); print(f"/t incremental deployment complete: {len(changed)} file(s). No remote files were deleted.")
          PY

      - name: Verify published active UI files without visual testing
        if: needs.plan.outputs.frontend == 'true'
        env:
          ACTIVE_UI_TEST: ${{ env.ACTIVE_UI_TEST }}
        run: |
          python - <<'PY'
          import hashlib, os
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          target = os.environ["ACTIVE_UI_TEST"]
          if not (target.isdigit() and len(target) == 2 and int(target) > 28):
              raise SystemExit("Refusing HTTP verification of a frozen or invalid target")
          root = Path("t") / target
          base = f"https://armaghantrading.com/t/{target}/"
          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__(); self.paths = []; self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "a" and "href" in attrs: self.links.append(attrs["href"])
                  if tag == "script" and "src" in attrs: self.paths.append(attrs["src"])
                  if tag == "link" and attrs.get("rel") == "stylesheet":
                      href = attrs.get("href", "")
                      if href and not urlparse(href).scheme and not href.startswith("//"): self.paths.append(href)
          parser = Assets()
          parser.feed((root / "index.html").read_text(encoding="utf-8"))
          if not parser.paths: raise SystemExit("Built page has no application assets")
          paths = ["index.html", *parser.paths]
          for path in paths:
              url = urljoin(base, path)
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.netloc != "armaghantrading.com" or not parsed.path.startswith(f"/t/{target}/"):
                  raise SystemExit("Asset escaped the active release directory")
              relative = parsed.path.removeprefix(f"/t/{target}/")
              local = root / relative
              expected = hashlib.sha256(local.read_bytes()).hexdigest()
              request = Request(url + "?release=" + expected[:16], headers={"Cache-Control": "no-cache"})
              with urlopen(request, timeout=30) as response: actual = hashlib.sha256(response.read()).hexdigest()
              if actual != expected: raise SystemExit(f"Published file checksum mismatch: {relative}")
              print(f"Published active UI file: {relative} PASS")
          with urlopen("https://armaghantrading.com/t/index.htm", timeout=30) as response:
              launch = Assets(); launch.feed(response.read().decode("utf-8"))
          if not launch.links or launch.links[0] != f"./{target}/index.html":
              raise SystemExit("Active test is not first in published launcher")
          print("Nonvisual HTTP release and launcher verification: PASS")
          PY
 <<< "$files" && root=true || true
                grep -q '^t/' <<< "$files" && t=true || true
                if is_frontend_release_change "$files"; then frontend=true; t=true; fi
                ;;
            esac
          else
            before="${{ github.event.before }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              files="$(git diff --name-only "$before" "$GITHUB_SHA")"
            else
              files="$(git diff --name-only HEAD^ HEAD)"
            fi
            grep -qx 'index.html' <<< "$files" && root=true || true
            grep -qx 'logo.png' <<< "$files" && root=true || true
                grep -Eq '^(config/root-release\.json|platform/scripts/promote_root_release\.py)
            grep -q '^t/' <<< "$files" && t=true || true
            if is_frontend_release_change "$files"; then frontend=true; t=true; fi
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "t=$t" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

