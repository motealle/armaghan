name: Gallery Admin Slice CI

on:
  push:
    branches: [work/gallery-admin-slice]
    paths:
      - ".github/workflows/gallery-admin-slice-ci.yml"
      - "platform/backend/**"
      - "platform/frontend/**"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
          extensions: ctype,curl,dom,fileinfo,filter,hash,mbstring,openssl,pcre,pdo,session,tokenizer,xml,sqlite3,pdo_sqlite,gd,exif
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer validate --strict
      - run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/database.sqlite
          php artisan migrate:fresh --force --no-interaction
          php artisan test
      - run: composer audit --locked --no-interaction

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: python -m pip install pillow
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build
