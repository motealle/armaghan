name: Resolve Google OAuth dependency lock
on:
  push:
    branches: [main]
    paths: [".github/workflows/google-dependency-lock.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
          extensions: ctype,curl,dom,fileinfo,mbstring,openssl,pdo,session,tokenizer,xml,sqlite3,pdo_sqlite,zip,gd,exif
      - name: Resolve official Socialite dependency without changing production
        run: composer require laravel/socialite:^5.27 --no-install --no-scripts --no-interaction --no-progress
      - name: Validate resolved lock
        run: composer validate --strict
      - uses: actions/upload-artifact@v4
        with:
          name: google-oauth-dependency-lock
          path: |
            platform/backend/composer.json
            platform/backend/composer.lock
          retention-days: 1
          if-no-files-found: error
