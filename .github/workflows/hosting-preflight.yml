name: Hosting Preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hosting-preflight.yml"
      - "platform/scripts/hosting_preflight.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosting-preflight-main
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run safe Laravel hosting preflight
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ARMAGHAN_SITE_URL: https://armaghantrading.com
          SITE_URL: ${{ secrets.SITE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          ARMAGHAN_SITE_URL_VAR: ${{ vars.ARMAGHAN_SITE_URL }}
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          APP_URL_VAR: ${{ vars.APP_URL }}
        run: python platform/scripts/hosting_preflight.py

      - name: Upload non-sensitive preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosting-preflight-result
          path: hosting-preflight-result.json
          if-no-files-found: warn
          retention-days: 3
