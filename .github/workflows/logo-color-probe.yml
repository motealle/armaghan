name: Logo Background Color Probe

on:
  push:
    branches:
      - ui/test27-editor-color-saveability-20261001
    paths:
      - ".github/workflows/logo-color-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --timeout 90 --retries 3 pillow==11.3.0
      - name: Report logo edge and dominant colors
        run: |
          python - <<'PY'
          from collections import Counter
          from PIL import Image
          im=Image.open("logo.png").convert("RGBA")
          w,h=im.size
          px=im.load()
          edge=[]
          for x in range(w):
              edge.extend([px[x,0],px[x,h-1]])
          for y in range(h):
              edge.extend([px[0,y],px[w-1,y]])
          def rgbhex(p): return "#%02X%02X%02X"%p[:3]
          edge_opaque=[p for p in edge if p[3]>=240]
          all_opaque=[p for p in im.getdata() if p[3]>=240]
          print("LOGO_SIZE",w,h)
          print("EDGE_DOMINANT",[(rgbhex(p),n) for p,n in Counter(edge_opaque).most_common(8)])
          print("IMAGE_DOMINANT",[(rgbhex(p),n) for p,n in Counter(all_opaque).most_common(12)])
          corners=[px[0,0],px[w-1,0],px[0,h-1],px[w-1,h-1],px[w//2,h//2]]
          print("SAMPLES",[rgbhex(p) for p in corners])
          PY
