name: Prepare Product Media Dependencies

on:
  push:
    branches:
      - "deps/product-media-20261002"
    paths:
      - ".github/workflows/prepare-product-media-deps.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deps/product-media-20261002
          fetch-depth: 0

      - name: Set up PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
          extensions: ctype,curl,dom,fileinfo,filter,hash,mbstring,openssl,pcre,pdo,session,tokenizer,xml,sqlite3,pdo_sqlite,zip,gd

      - name: Lock official Filament + Spatie media integration
        working-directory: platform/backend
        run: |
          composer require filament/spatie-laravel-media-library-plugin:"^5.0" -W --no-interaction --no-progress
          php artisan vendor:publish --provider="Spatie\MediaLibrary\MediaLibraryServiceProvider" --tag="medialibrary-migrations"
          composer validate --strict

      - name: Commit generated dependency lock and migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/backend/composer.json platform/backend/composer.lock platform/backend/database/migrations
          git diff --cached --exit-code && { echo "No dependency changes generated"; exit 1; } || true
          git commit -m "build(media): lock official Spatie dependencies"
          git push origin HEAD:deps/product-media-20261002
