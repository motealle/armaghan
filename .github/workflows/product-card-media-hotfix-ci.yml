name: Product Card Media Hotfix CI

on:
  push:
    branches: [work/product-card-media-hotfix]
    paths:
      - ".github/workflows/product-card-media-hotfix-ci.yml"
      - "platform/frontend/**"
      - "config/root-release.json"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - run: python -m pip install pillow
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit -- src/features/catalog/services/catalogApi.spec.ts
      - run: npm run build
