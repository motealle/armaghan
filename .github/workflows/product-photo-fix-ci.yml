name: Product Photo Fix CI

on:
  push:
    branches: [work/product-photo-fix]
    paths:
      - ".github/workflows/product-photo-fix-ci.yml"
      - "platform/frontend/**"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
