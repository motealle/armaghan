name: Production SQLite Reprobe
# diagnostic revision 6

on:
  push:
    branches:
      - backend/production-sqlite-activation-20261001
    paths:
      - ".github/workflows/production-sqlite-reprobe.yml"

permissions:
  contents: read

jobs:
  reprobe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-probe production SQLite capability
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ARMAGHAN_SITE_URL: https://armaghantrading.com
          SITE_URL: ${{ secrets.SITE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          ARMAGHAN_SITE_URL_VAR: ${{ vars.ARMAGHAN_SITE_URL }}
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          APP_URL_VAR: ${{ vars.APP_URL }}
        run: python platform/scripts/hosting_preflight.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-sqlite-reprobe
          path: hosting-preflight-result.json
          retention-days: 1
