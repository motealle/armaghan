name: Production Style Profile Acceptance

on:
  push:
    branches:
      - backend/style-profile-production-acceptance-20261001
    paths:
      - ".github/workflows/production-style-profile-acceptance.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify helper contract
        run: python tests/test_style_profile_production_acceptance_helper.py

      - name: Exercise live SQLite Style Profile persistence with rollback
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ARMAGHAN_SITE_URL: ${{ secrets.ARMAGHAN_SITE_URL }}
        run: python platform/scripts/verify_style_profile_ftp.py
