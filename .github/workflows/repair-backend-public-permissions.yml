name: Repair Backend Public Permissions

on:
  push:
    branches:
      - backend/production-sqlite-activation-20261001
    paths:
      - ".github/workflows/repair-backend-public-permissions.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair public backend permissions and verify routes
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python - <<'PY'
          import io, json, os, secrets, ssl
          from ftplib import FTP
          from urllib.parse import urlparse, urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          raw=os.environ["FTP_SERVER"].strip()
          parsed=urlparse(raw) if "://" in raw else None
          host=parsed.hostname if parsed else raw
          port=(parsed.port or 21) if parsed else 21
          token=secrets.token_hex(8)
          secret=secrets.token_urlsafe(24)
          name=f"armaghan-backend-perm-{token}.php"
          php=f"""<?php
          header('Content-Type: application/json; charset=utf-8');
          if (!hash_equals('{secret}', (string) ($_GET['token'] ?? ''))) {{
              http_response_code(404); echo json_encode(['ok'=>false]); exit;
          }}
          $root = __DIR__ . '/backend';
          if (!is_dir($root)) {{
              http_response_code(500); echo json_encode(['ok'=>false,'stage'=>'missing-backend']); exit;
          }}
          $dirs=0; $files=0;
          @chmod($root, 0755); $dirs++;
          $it = new RecursiveIteratorIterator(
              new RecursiveDirectoryIterator($root, FilesystemIterator::SKIP_DOTS),
              RecursiveIteratorIterator::SELF_FIRST
          );
          foreach ($it as $item) {{
              if ($item->isDir()) {{ @chmod($item->getPathname(),0755); $dirs++; }}
              else {{ @chmod($item->getPathname(),0644); $files++; }}
          }}
          echo json_encode(['ok'=>true,'dirs'=>$dirs,'files'=>$files]);
          """
          ftp=FTP(); ftp.connect(host,port,timeout=20); ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])
          try:
              ftp.cwd("/public_html")
              ftp.storbinary("STOR "+name, io.BytesIO(php.encode("utf-8")))
              url="https://armaghantrading.com/"+name+"?"+urlencode({"token":secret})
              with urlopen(Request(url,headers={"User-Agent":"Armaghan-Permission-Repair/1.0"}),timeout=40,context=ssl.create_default_context()) as r:
                  result=json.loads(r.read(65536).decode("utf-8"))
              print("permission_repair_ok:", bool(result.get("ok")))
              print("public_dirs_repaired:", int(result.get("dirs",0)))
              print("public_files_repaired:", int(result.get("files",0)))
          finally:
              try:
                  ftp.cwd("/public_html"); ftp.delete(name)
              except Exception:
                  pass
              try: ftp.quit()
              except Exception: ftp.close()

          urls=[
              "https://armaghantrading.com/backend/index.php",
              "https://armaghantrading.com/backend/",
              "https://armaghantrading.com/backend/up",
              "https://armaghantrading.com/backend/api/style-profile/staging",
              "https://armaghantrading.com/backend/admin/login",
          ]
          statuses={}
          for url in urls:
              path=url.split("armaghantrading.com",1)[1]
              try:
                  with urlopen(Request(url,headers={"User-Agent":"Armaghan-Backend-Smoke/1.0","Accept":"application/json,text/html;q=0.9"}),timeout=30,context=ssl.create_default_context()) as r:
                      body=r.read(8192)
                      statuses[path]=(r.status,r.headers.get_content_type(),len(body))
              except HTTPError as e:
                  statuses[path]=(e.code,e.headers.get_content_type() if e.headers else "unknown",0)
          for path,value in statuses.items():
              print(path,*value)
          if statuses["/backend/index.php"][0] >= 400:
              raise SystemExit("backend index still unreachable")
          if statuses["/backend/up"][0] >= 400:
              raise SystemExit("backend health still unreachable")
          if statuses["/backend/api/style-profile/staging"][0] >= 400:
              raise SystemExit("style profile API still unreachable")
          PY
