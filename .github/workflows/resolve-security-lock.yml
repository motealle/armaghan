name: Resolve targeted security lock
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/resolve-security-lock.yml']
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: mbstring,dom,xml,fileinfo,curl,gd,exif,pdo_sqlite
      - name: Resolve only the two advisory fixes with Composer
        run: composer update 'livewire/livewire:4.4.8' 'symfony/mime:7.4.22' --minimal-changes --no-install --no-scripts --no-interaction --no-progress
      - name: Validate and audit generated lock
        run: |
          composer validate --strict
          composer audit --locked --no-interaction
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-security-lock
          path: platform/backend/composer.lock
          retention-days: 1
          if-no-files-found: error
