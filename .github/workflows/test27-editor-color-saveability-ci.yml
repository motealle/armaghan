name: Test 27 Editor Color Saveability CI
# validation revision 2

on:
  push:
    branches:
      - ui/test27-editor-color-saveability-20261001
    paths:
      - ".github/workflows/test27-editor-color-saveability-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image build dependency
        run: python -m pip install --disable-pip-version-check --timeout 90 --retries 3 pillow==11.3.0
      - name: Install frontend dependencies
        working-directory: platform/frontend
        run: npm ci --no-audit --no-fund
      - name: Validate Test 27
        run: python tests/test_test27_visual_editor_contract.py
      - name: Type-check, unit-test and build
        working-directory: platform/frontend
        env:
          ARMAGHAN_UI_TARGET: "27"
        run: |
          npm run type-check
          npm run test:unit
          npm run build
          test -f ../../t/27/index.html

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
          extensions: ctype,curl,dom,fileinfo,filter,hash,mbstring,openssl,pcre,pdo,session,tokenizer,xml,sqlite3,pdo_sqlite
      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare SQLite test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/database.sqlite
          php artisan migrate:fresh --force --no-interaction
      - name: Run backend tests
        run: php artisan test
      - name: Audit backend dependencies
        run: composer audit --locked --no-interaction
