name: Test 27 Style Profile Adapter CI
# validation revision 2

on:
  push:
    branches:
      - ui/test27-style-profile-adapter-20261001
    paths:
      - ".github/workflows/test27-style-profile-adapter-ci.yml"

permissions:
  contents: read

concurrency:
  group: test27-style-profile-adapter
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Test 27 adapter contract
        run: python tests/test_test27_visual_editor_contract.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json

      - name: Install portrait media build dependency
        run: python -m pip install --disable-pip-version-check --timeout 90 --retries 3 pillow==11.3.0

      - name: Install frontend dependencies
        working-directory: platform/frontend
        run: npm ci --no-audit --no-fund

      - name: Type-check, unit-test and build Test 27
        working-directory: platform/frontend
        env:
          ARMAGHAN_UI_TARGET: "27"
        run: |
          npm run type-check
          npm run test:unit
          npm run build
          test -f ../../t/27/index.html
