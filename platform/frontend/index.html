<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151EDA" />
    <meta name="description" content="ارمغان — تولید و صادرات پوشاک" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/misc/Farsi-Digits/Vazirmatn-FD-font-face.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" />
    <link rel="icon" href="../../logo.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ارمغان | تولید و صادرات پوشاک</title>
    <script>
      (() => {
        try {
          const saved=localStorage.getItem('armaghan:test19:theme');
          const mode=(saved==='light'||saved==='dark')
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
          const dark=mode==='dark';
          document.documentElement.classList.toggle('dark',dark);
          document.documentElement.dataset.theme=mode;
          document.documentElement.style.colorScheme=mode;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
