<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151EDA" />
    <meta name="description" content="ارمغان — تولید و صادرات پوشاک" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" />
    <link rel="icon" href="../../logo.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ارمغان | Test 16 — Adaptive Commerce</title>
      <script>
      (() => {
        try {
          const saved=localStorage.getItem('armaghan:test16:theme') || 'system';
          const dark=saved==='dark' || (saved==='system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark',dark);
          document.documentElement.dataset.theme=dark?'dark':'light';
          document.documentElement.style.colorScheme=dark?'dark':'light';
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
