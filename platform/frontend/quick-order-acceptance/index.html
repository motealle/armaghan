<!doctype html><html lang="fa" dir="rtl"><head><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="app"></div><script type="module">
import {createApp,h,ref,computed} from 'vue';import {createPinia} from 'pinia';import {createRouter,createMemoryHistory} from 'vue-router';
import Table from '/src/features/admin/components/BackendProductsPanel.vue';import Grid from '/src/features/catalog/components/ProductGrid.vue';import Home from '/src/views/HomeView.vue';import {useAdminStore} from '/src/features/admin/store.ts';import {useLocaleStore} from '/src/stores/locale.ts';import {useCatalogStore} from '/src/stores/catalog.ts';import {useAppearanceStore} from '/src/stores/appearance.ts';import {useProductQuickOrder} from '/src/features/admin/services/productQuickOrder.ts';import {mergeProduct} from '/src/features/catalog/services/catalogApi.ts';import {filterCatalogProducts} from '/src/features/catalog/services/productFilters.ts';import '/src/styles/main.css';
const pinia=createPinia(),router=createRouter({history:createMemoryHistory(),routes:[{path:'/:pathMatch(.*)*',component:{render:()=>null}}]});
const app=createApp({setup(){const admin=useAdminStore(),locale=useLocaleStore(),catalog=useCatalogStore(),appearance=useAppearanceStore(),mode=ref('table'),filter=ref('');locale.locale='fa';admin.identity={name:'Synthetic QA',email:'qa@example.invalid'};
for(const profile of ['mobile','tablet','desktop'])appearance.updateProfile(profile,{homeProductGrid:'recommended-6',showAbout:false,showWhy:false,showCapabilities:false,showProductBanners:false});
const order=useProductQuickOrder();const products=computed(()=>filterCatalogProducts(catalog.items,{category:'all',subcategory:'all',availability:'all',query:filter.value},p=>p.name,p=>p.subcategoryName));
window.qa={mode:value=>mode.value=value,filter:value=>filter.value=value,logout:()=>admin.clear(),setLocale:value=>locale.setManual(value),init:async()=>{const {data}=await(await fetch('/backend/api/catalog/products')).json();catalog.items=data.map(p=>mergeProduct({...p,media:['baby','kids'].map((category,index)=>({id:String(p.id*2+index),url:'/images/final/categories/category-'+category+'.webp',thumb_url:'/images/final/categories/category-'+category+'.webp',width:1600,height:1200}))}));catalog.syncState='synced'},order:()=>products.value.map(p=>p.code)};
return()=>h('main',{style:'max-width:1100px;margin:auto;padding:12px'},[mode.value==='table'?h(Table,{externalEditor:true}):mode.value==='home'?h(Home):h(Grid,{products:products.value,adminEditable:!!admin.identity,adminOrderable:!!admin.identity})])}});app.use(pinia);app.use(router);app.mount('#app');window.qa.init();
</script></body></html>
