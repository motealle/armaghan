<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="preconnect" href="https://cdn.jsdelivr.net"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css"><title>تست ۰۲ — جزئیات سریع محصول</title><style>:root{font-family:Vazirmatn,system-ui;background:#f7f7f8;color:#17181c}*{box-sizing:border-box}body{margin:0}.top{padding:18px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:2}.wrap{max-width:920px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid #e8e8ea;border-radius:18px;padding:10px;text-align:right;cursor:pointer}.pic{height:170px;border-radius:13px;background:linear-gradient(145deg,#dce4ef,#f3d8d2)}.name{font-weight:800;margin:10px 2px 4px}.meta{font-size:12px;color:#747782}.price{margin-top:9px;font-size:13px;font-weight:700}.sheet{position:fixed;inset:auto 0 0;background:#fff;border-radius:24px 24px 0 0;padding:22px;box-shadow:0 -10px 40px #0002;transform:translateY(105%);transition:.25s;z-index:5}.sheet.open{transform:none}.back{position:fixed;inset:0;background:#0005;opacity:0;pointer-events:none;z-index:4}.back.open{opacity:1;pointer-events:auto}button{border:0;border-radius:12px;padding:12px 16px;background:#0613bf;color:#fff;font:inherit;font-weight:700}.tag{display:inline-block;background:#eef0ff;color:#0613bf;border-radius:99px;padding:5px 9px;font-size:11px;margin:4px 0}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.sheet{width:520px;right:20px;left:auto;bottom:20px;border-radius:24px}}</style></head><body><header class="top"><strong>تست ۰۲ · جزئیات سریع</strong><a href="../index.htm">فهرست تست‌ها</a></header><main class="wrap"><p>فرضیه: کاربر باید بتواند بدون ترک فهرست، جزئیات کلیدی را ببیند و تصمیم به استعلام بگیرد.</p><section class="grid" id="grid"></section></main><div class="back" id="back"></div><aside class="sheet" id="sheet"><span class="tag">موجود</span><h2 id="title"></h2><p>جنس: پنبه‌ای · رنگ: چندرنگ · سایزبندی: متغیر</p><p>مشخصات ثابت و متغیر جدا نمایش داده می‌شوند تا مسیر تصمیم‌گیری کوتاه بماند.</p><button onclick="closeSheet()">بستن</button></aside><script>const items=['ست نوزادی پنبه‌ای','هودی بچگانه ساده','پیراهن زنانه لینن','شلوار بچگانه راحتی','بلوز زنانه یقه‌دار','سرهمی نوزادی'];const grid=document.querySelector('#grid'),sheet=document.querySelector('#sheet'),back=document.querySelector('#back'),title=document.querySelector('#title');items.forEach((x,i)=>grid.insertAdjacentHTML('beforeend',`<article class="card" onclick="openSheet(${i})"><div class="pic"></div><div class="name">${x}</div><div class="meta">کد محصول: ARM-${String(i+1).padStart(3,'0')}</div><div class="price">استعلام قیمت</div></article>`));function openSheet(i){title.textContent=items[i];sheet.classList.add('open');back.classList.add('open')}function closeSheet(){sheet.classList.remove('open');back.classList.remove('open')}back.onclick=closeSheet;</script></body></html>
