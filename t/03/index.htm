<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="preconnect" href="https://cdn.jsdelivr.net"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css"><title>تست ۰۳ — سبد استعلام</title><style>:root{font-family:Vazirmatn,system-ui;background:#f5f6f8;color:#17181c}*{box-sizing:border-box}body{margin:0}.top{background:#fff;padding:18px;display:flex;justify-content:space-between;position:sticky;top:0}.wrap{max-width:850px;margin:auto;padding:20px}.row{background:#fff;border:1px solid #e5e6ea;border-radius:18px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:center}.pic{width:80px;height:80px;border-radius:12px;background:linear-gradient(145deg,#d8e5f2,#ead7d2)}.info{flex:1}.muted{font-size:12px;color:#777}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border:0;border-radius:9px;background:#eceefe;color:#0613bf;font:inherit;font-weight:800}.cta{position:sticky;bottom:0;background:#fff;padding:14px;border-top:1px solid #ddd}button.main{width:100%;padding:14px;border:0;border-radius:14px;background:#0613bf;color:white;font:inherit;font-weight:800}.empty{text-align:center;padding:40px}a{color:inherit}</style></head><body><header class="top"><strong>تست ۰۳ · RFQ Cart</strong><a href="../index.htm">فهرست</a></header><main class="wrap"><h2>سبد استعلام</h2><p>فرضیه: تجمیع چند مدل در یک درخواست، برای خریدار عمده واضح‌تر از استعلام‌های جداست.</p><section id="cart"></section></main><div class="cta"><button class="main" onclick="send()">ساخت پیام استعلام واتساپ</button></div><script>let items=[['ست نوزادی پنبه‌ای',2],['هودی بچگانه ساده',1],['پیراهن زنانه لینن',3]];const cart=document.querySelector('#cart');function render(){cart.innerHTML=items.map((x,i)=>`<div class="row"><div class="pic"></div><div class="info"><strong>${x[0]}</strong><div class="muted">مشخصات متغیر: رنگ و سایز</div></div><div class="qty"><button onclick="change(${i},-1)">−</button><b>${x[1]}</b><button onclick="change(${i},1)">+</button></div></div>`).join('')}function change(i,d){items[i][1]=Math.max(0,items[i][1]+d);render()}function send(){const text='سلام، برای استعلام این موارد پیام می‌دهم:\n'+items.filter(x=>x[1]).map(x=>`• ${x[0]} × ${x[1]}`).join('\n');location.href='https://wa.me/989000000000?text='+encodeURIComponent(text)}render();</script></body></html>
